# Deploy otomatis ke Firebase Hosting setiap ada perubahan di branch main.
# Website tanpa build step: isi folder `website` dipasang apa adanya (lihat firebase.json).
# Kunci layanan disimpan di GitHub Secrets (FIREBASE_SERVICE_ACCOUNT_TIRTONIC_STUDIO), tidak pernah di repo.
name: Deploy ke Firebase Hosting
on:
  push:
    branches:
      - main
    paths:
      - 'website/**'
      - 'firebase.json'
      - '.github/workflows/firebase-hosting-merge.yml'
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TIRTONIC_STUDIO }}
          channelId: live
          projectId: tirtonic-studio
